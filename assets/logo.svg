<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What to Use When logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="32" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
  <!-- compass needle: points to the right tool -->
  <polygon points="80,34 92,80 80,72 68,80" fill="#FFFFFF"/>
  <polygon points="80,126 68,80 80,88 92,80" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="80" cy="80" r="7" fill="#FFFFFF"/>
  <!-- cardinal ticks -->
  <g fill="#FFFFFF" fill-opacity="0.8">
    <rect x="78" y="20" width="4" height="10" rx="2"/>
    <rect x="78" y="130" width="4" height="10" rx="2"/>
    <rect x="20" y="78" width="10" height="4" rx="2"/>
    <rect x="130" y="78" width="10" height="4" rx="2"/>
  </g>
</svg>
